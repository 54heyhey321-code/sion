<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203e36"><title>찰랑찰랑 · 물 채우기</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="brand">쉬어가는 한 판</span><button id="reset" class="quiet">↻ 다시 시작</button></header><section class="intro"><p class="eyebrow">한 컵으로 즐기는 아슬아슬한 승부</p><h1>찰랑<span>찰랑</span><i>✳</i></h1><p>조금만 더? 넘치는 순간, 내 차례는 끝!</p></section><section class="game"><div class="topline"><div class="select" aria-label="플레이어 수"><button data-count="2" aria-pressed="true">2인</button><button data-count="3" aria-pressed="false">3인</button></div><span id="round">TURN 01</span></div><div id="players" class="players"></div><div class="status" aria-live="polite"><h2 id="title"></h2><p id="hint"></p></div><div class="scene" id="scene"><div class="tiles"></div><button id="tap" aria-label="수도꼭지: 누르고 있으면 물 채우기"><svg viewBox="0 0 290 180" aria-hidden="true"><defs><linearGradient id="metal"><stop stop-color="#a9c1b4"/><stop offset=".45" stop-color="#f0f1d8"/><stop offset="1" stop-color="#6f9184"/></linearGradient></defs><path d="M60 170V76Q60 40 95 40H181Q217 40 217 77V99" fill="none" stroke="#182f29" stroke-width="40"/><path d="M60 170V76Q60 40 95 40H181Q217 40 217 77V99" fill="none" stroke="url(#metal)" stroke-width="30"/><rect x="195" y="88" width="44" height="23" rx="5" fill="#e5ebd4" stroke="#243c32" stroke-width="4"/><path d="M132 40V17M105 17H159" stroke="#203d33" stroke-width="15" stroke-linecap="round"/><path d="M105 14H159" stroke="#edbf67" stroke-width="9" stroke-linecap="round"/></svg><span>여기를 꾹!</span></button><div class="stream"></div><div class="cup"><div id="water" class="water"><div class="wave"></div><div class="face">• ᴗ •</div></div><div class="shine"></div><div class="rim"></div></div><div class="spill"></div><div class="shelf"></div><span class="scene-note">조심조심, 한 방울까지.</span></div><button id="pour" class="primary">꾹 눌러 물 채우기 <span>손을 떼면 다음 차례 →</span></button><button id="next" class="primary" hidden>다음 플레이어 준비 완료 →</button><button id="again" class="primary" hidden>한 판 더 하기 ↻</button><p class="fine">수도꼭지 또는 아래 버튼을 누르고 있어요 · 키보드는 스페이스</p></section><footer><span>01 꾹 누르고</span><b>·</b><span>02 손을 떼고</span><b>·</b><span>03 넘치면 패배!</span></footer></main><script src="game.js"></script></body></html>
